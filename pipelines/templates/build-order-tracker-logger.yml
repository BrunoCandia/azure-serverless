jobs:
  - job: BuildOrderTrackerLogger
    displayName: Build order-tracker-logger-function (Node.js)
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: NodeTool@0
        displayName: Use Node.js 22.x
        inputs:
          versionSpec: '22.x'

      - script: |
          cd order-tracker-logger-function
          npm ci --omit=dev
        displayName: Install npm dependencies

      - task: ArchiveFiles@2
        displayName: Archive order-tracker-logger-function
        inputs:
          rootFolderOrFile: order-tracker-logger-function
          includeRootFolder: false
          archiveType: zip
          archiveFile: $(Build.ArtifactStagingDirectory)/order-tracker-logger-function.zip

      - publish: $(Build.ArtifactStagingDirectory)/order-tracker-logger-function.zip
        artifact: order-tracker-logger-function
