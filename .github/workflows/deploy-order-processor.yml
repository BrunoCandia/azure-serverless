name: Deploy Order Process Function App

on:
  push:
    branches:
      - main
    paths:
      - 'order-processor-function/**'
      - '.github/workflows/deploy-order-processor.yml'
  workflow_dispatch: # allow manual execution

jobs:
  deploy-order-processor:
    name: Deploy Order Processor Function App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        working-directory: order-processor-function
        run: dotnet restore

      - name: Build Project
        working-directory: order-processor-function
        run: dotnet build --configuration Release --no-restore

      - name: Publish Project
        working-directory: order-processor-function
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Deploy to Azure Function App
        uses: azure/functions-action@v1
        with:
          app-name: 'order-system-order-processor-dev-func100'
          package: './order-processor-function/publish'
          publish-profile: ${{ secrets.ORDER_PROCESS_AZURE_FUNCTION_APP_PUBLISH_PROFILE }}