name: Deploy Order Tracker Logger Function App

on:
  push:
    branches:
      - main
    paths:
      - 'order-tracker-logger-function/**'
      - '.github/workflows/deploy-order-tracker-logger.yml'
  workflow_dispatch: # allow manual execution

jobs:
  deploy-order-tracker-logger:
    name: Deploy Order Tracker Logger Function App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup NodeJs
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Dependencies
        working-directory: order-tracker-logger-function
        run: npm install

      - name: Deploy to Azure Function App
        uses: azure/functions-action@v1
        with:
          app-name: 'order-system-order-tracker-logger-dev-func100'
          package: 'order-tracker-logger-function'
          publish-profile: ${{ secrets.ORDER_TRACKER_LOGGER_AZURE_FUNCTION_APP_PUBLISH_PROFILE }}