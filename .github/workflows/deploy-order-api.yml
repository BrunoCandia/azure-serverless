name: Deploy Order API Function App

on:
  push:
    branches:
      - main
    paths:
      - 'order-api-function/**'
      - '.github/workflows/deploy-order-api.yml'
  workflow_dispatch: # allow manual execution

jobs:
  deploy-order-api:
    name: Deploy Order API Function App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4        
        with:
          python_version: 3.14

      - name: Create a new virtual environment
        run: |
          python -m venv .venv
          source .venv/bin/activate          

      - name: Install dependencies
        run: |
          cd order-api-function
          python -m pip install --upgrade pip
          pip install -r requirements.txt      

      - name: Deploy Order API Function App to Azure
        uses: azure/functions-action@v1
        with:
          app-name: 'order-system-api-dev-func100'
          package: order-api-function
          publish-profile: ${{ secrets.AZURE_FUNCTION_APP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true